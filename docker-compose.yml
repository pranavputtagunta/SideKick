version: '3.8'
services:
  db:
    image: postgres:13
    container_name: sidekick_db
    environment:
      - POSTGRES_USER=sidekick
      - POSTGRES_PASSWORD=sidekick
      - POSTGRES_DB=sidekick
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: "redis:7-alpine"
    container_name: sidekick_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
